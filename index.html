<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Votex | Decentralized Voting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0a0a0b;
      --surface:#111114;
      --surface2:#18181d;
      --border:#2a2a35;
      --border2:#3a3a48;
      --accent:#c8f55a;
      --accent-dim:#9dc43a;
      --text:#f0f0ec;
      --muted:#7a7a8a;
    }
    html,body{height:100%;background:var(--bg)}
    body{
      font-family:'Syne',sans-serif;
      color:var(--text);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:48px 20px 80px;
    }
    .bg-grid{
      position:fixed;inset:0;z-index:0;pointer-events:none;
      background-image:
        linear-gradient(var(--border) 1px,transparent 1px),
        linear-gradient(90deg,var(--border) 1px,transparent 1px);
      background-size:48px 48px;
      opacity:0.35;
    }
    .bg-glow{
      position:fixed;top:-120px;left:50%;transform:translateX(-50%);
      width:600px;height:400px;
      background:radial-gradient(ellipse at center,rgba(200,245,90,0.08) 0%,transparent 70%);
      pointer-events:none;z-index:0;
    }
    .wrap{position:relative;z-index:1;width:100%;max-width:680px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:56px}
    .logo{display:flex;align-items:center;gap:12px}
    .logo-mark{
      width:36px;height:36px;border:2px solid var(--accent);
      border-radius:8px;display:flex;align-items:center;justify-content:center;
    }
    .logo-mark::after{
      content:'';width:10px;height:10px;
      background:var(--accent);border-radius:2px;
      animation:pulse 2s ease-in-out infinite;
    }
    @keyframes pulse{
      0%,100%{opacity:1;transform:scale(1)}
      50%{opacity:0.6;transform:scale(0.85)}
    }
    .logo-text{font-size:20px;font-weight:800;letter-spacing:-0.02em}
    .logo-text span{color:var(--accent)}
    .wallet-btn{
      display:flex;align-items:center;gap:8px;
      background:var(--surface);border:1px solid var(--border);
      border-radius:100px;padding:8px 16px;
      font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);
      cursor:pointer;transition:all 0.2s;
    }
    .wallet-btn:hover{border-color:var(--border2);color:var(--text)}
    .wallet-btn.connected{border-color:rgba(200,245,90,0.4);color:var(--accent)}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:all 0.3s}
    .wallet-btn.connected .dot{background:var(--accent);box-shadow:0 0 6px var(--accent)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:40px}
    .stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
    .stat-val{font-size:28px;font-weight:700;line-height:1;margin-bottom:4px}
    .stat-val.accent{color:var(--accent)}
    .stat-lbl{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}
    .section-label{
      font-family:'DM Mono',monospace;font-size:11px;
      letter-spacing:0.12em;color:var(--muted);
      text-transform:uppercase;margin-bottom:16px;
    }
    .candidates-section{margin-bottom:36px}
    .candidates-list{display:flex;flex-direction:column;gap:8px}
    .candidate-card{
      background:var(--surface);border:1px solid var(--border);border-radius:12px;
      padding:18px 20px;display:flex;align-items:center;gap:16px;
      cursor:default;transition:all 0.2s;position:relative;overflow:hidden;
    }
    .candidate-card::before{
      content:'';position:absolute;left:0;top:0;bottom:0;
      width:3px;background:var(--border2);transition:background 0.2s;
    }
    .candidate-card:hover{border-color:var(--border2);transform:translateX(2px)}
    .candidate-card:hover::before{background:var(--accent)}
    .candidate-card.winner{border-color:rgba(200,245,90,0.35)}
    .candidate-card.winner::before{background:var(--accent)}
    .cand-rank{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);width:24px;flex-shrink:0}
    .cand-info{flex:1;min-width:0}
    .cand-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cand-votes{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);margin-top:2px}
    .bar-wrap{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;min-width:60px}
    .bar-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.6s cubic-bezier(0.4,0,0.2,1)}
    .cand-pct{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);width:36px;text-align:right;flex-shrink:0}
    .vote-btn{
      background:transparent;border:1px solid var(--border);border-radius:8px;
      padding:6px 14px;font-family:'Syne',sans-serif;font-size:12px;font-weight:600;
      color:var(--muted);cursor:pointer;transition:all 0.2s;flex-shrink:0;
    }
    .vote-btn:hover{border-color:var(--accent);color:var(--accent)}
    .vote-btn.voted{border-color:rgba(200,245,90,0.4);color:var(--accent);background:rgba(200,245,90,0.06)}
    .empty{
      text-align:center;padding:48px 0;
      font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);
    }
    .empty-icon{font-size:28px;margin-bottom:12px;opacity:0.4}
    .add-section{
      background:var(--surface);border:1px solid var(--border);
      border-radius:16px;padding:28px;
    }
    .add-title{font-size:16px;font-weight:700;margin-bottom:6px}
    .add-sub{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:20px}
    .input-row{display:flex;gap:10px}
    .text-input{
      flex:1;background:var(--bg);border:1px solid var(--border);
      border-radius:10px;padding:12px 16px;
      font-family:'DM Mono',monospace;font-size:13px;color:var(--text);
      outline:none;transition:border-color 0.2s;
    }
    .text-input::placeholder{color:var(--muted)}
    .text-input:focus{border-color:var(--accent)}
    .add-btn{
      background:var(--accent);border:none;border-radius:10px;
      padding:12px 22px;font-family:'Syne',sans-serif;font-size:13px;
      font-weight:700;color:#0a0a0b;cursor:pointer;white-space:nowrap;
      transition:all 0.15s;
    }
    .add-btn:hover{background:var(--accent-dim);transform:translateY(-1px)}
    .add-btn:active{transform:translateY(0)}
    .toast{
      position:fixed;bottom:32px;left:50%;
      transform:translateX(-50%) translateY(80px);
      background:var(--surface2);border:1px solid var(--border2);
      border-radius:10px;padding:12px 20px;
      font-family:'DM Mono',monospace;font-size:13px;color:var(--text);
      transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
      z-index:999;white-space:nowrap;pointer-events:none;
    }
    .toast.show{transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="wrap">
    <header>
      <div class="logo">
        <div class="logo-mark"></div>
        <div class="logo-text">Vote<span>x</span></div>
      </div>
      <button type="button" class="wallet-btn" id="connectBtn">
        <div class="dot" id="walletDot"></div>
        <span id="accountLabel">Connect wallet</span>
      </button>
    </header>

    <div class="stats">
      <div class="stat">
        <div class="stat-val accent" id="totalVotes">0</div>
        <div class="stat-lbl">total votes</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="totalCands">0</div>
        <div class="stat-lbl">candidates</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="statusLabel" style="font-size:16px;padding-top:6px">Idle</div>
        <div class="stat-lbl">status</div>
      </div>
    </div>

    <div class="candidates-section">
      <div class="section-label">Candidates</div>
      <div class="candidates-list" id="candidatesList">
        <div class="empty">
          <div class="empty-icon">◎</div>
          Connect your wallet to load on-chain candidates.
        </div>
      </div>
    </div>

    <div class="add-section">
      <div class="add-title">Add a candidate</div>
      <div class="add-sub">// on-chain · irreversible · trustless</div>
      <div class="input-row">
        <input class="text-input" type="text" id="candidateInput" placeholder="candidate_name" />
        <button type="button" class="add-btn" id="addCandidateBtn">Add →</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Web3 library first, then our app (no inline scripts = no global collisions) -->
  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.4/dist/web3.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
